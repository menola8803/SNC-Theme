name: Bygg APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Bygg release-APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Döp om APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SNC-Tema-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SNC-Tema-apk
          path: SNC-Tema-v1.0.${{ github.run_number }}.apk

      - name: Publicera release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            "SNC-Tema-v1.0.${{ github.run_number }}.apk" \
            --title "SNC Tema v1.0.${{ github.run_number }}" \
            --notes "Tema för Scandinavian Nexum Consulting på LineageOS (OnePlus 13R). Innehåller bakgrunder för hem- och låsskärm, skärmsläckaren SNC Klocka och klockwidgeten SNC Klocka." \
            --latest
