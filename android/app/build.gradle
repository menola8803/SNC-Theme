plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '3').toInteger()

android {
    namespace 'se.snc.theme'
    compileSdk 35

    defaultConfig {
        applicationId 'se.snc.theme'
        minSdk 29
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        // Signeringsnyckel för temat. Den är inte hemlig (repot är publikt);
        // den finns här så att nya versioner kan installeras ovanpå gamla.
        snc {
            storeFile file('snc-sign.keystore')
            storePassword 'sncandroid'
            keyAlias 'snc'
            keyPassword 'sncandroid'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.snc
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
