plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '3').toInteger()

android {
    namespace 'se.snc.theme'
    compileSdk 35

    defaultConfig {
        applicationId 'se.snc.theme'
        minSdk 29
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        // Nyckeln kommer från GitHub-hemligheterna SNC_KEYSTORE_BASE64 och
        // SNC_KEYSTORE_PASSWORD; arbetsflödet skriver den till release.keystore.
        snc {
            storeFile file('release.keystore')
            storePassword System.getenv('SNC_KEYSTORE_PASSWORD')
            keyAlias 'snc'
            keyPassword System.getenv('SNC_KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.snc
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
